<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="title desc">
<title id="title">按任务选择最小有效方案</title><desc id="desc">三个独立场景，不是必须走完的升级路线；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="830" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">按任务选择最小有效方案</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">三个独立场景，不是必须走完的升级路线</text><rect x="32" y="124" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="124" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">机械修复</text><text x="52" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">确定规则转换 + 独立测试</text><text x="52" y="269" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">失败证据：误改、漏修、过多人工特例</text><rect x="32" y="306" width="576" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="306" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="335" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="371" font-size="28" text-anchor="start" font-weight="700" fill="#182638">根因未知的 bug</text><text x="52" y="402" font-size="24" text-anchor="start" font-weight="400" fill="#182638">受限自主会话 + 独立交付核验</text><text x="52" y="451" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">失败证据：旧证据、中断丢任务、重复 PR</text><rect x="32" y="488" width="576" height="112" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="32" y="488" width="7" height="112" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="52" y="517" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="52" y="553" font-size="28" text-anchor="start" font-weight="700" fill="#182638">多人协作任务板</text><text x="52" y="584" font-size="24" text-anchor="start" font-weight="400" fill="#182638">身份与归属 + 事件驱动调度</text><text x="52" y="633" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">失败证据：无人收尾、越权、迟到覆盖</text><rect x="32" y="680" width="576" height="58" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="715" font-size="24" text-anchor="start" font-weight="400" fill="#126653">只有观察到明确失败，才增加对应复杂度。</text><path d="M32,762 L608,762" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="781" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="799" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="781" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="799" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="781" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="799" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="781" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="799" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>