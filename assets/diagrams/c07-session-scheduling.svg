<svg xmlns="http://www.w3.org/2000/svg" width="640" height="911" viewBox="0 0 640 911" role="img" aria-labelledby="title desc">
<title id="title">恢复会话与定时启动分开看</title><desc id="desc">依据官方当前文档，具体可用范围请查原文；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="911" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">恢复会话与定时启动分开看</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">依据官方当前文档，具体可用范围请查原文</text><rect x="32" y="120" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="155" font-size="28" text-anchor="start" font-weight="700" fill="#126653">resume：继续会话记录</text><text x="52" y="186" font-size="24" text-anchor="start" font-weight="400" fill="#182638">不会回滚文件修改，也不会撤销外部动作</text><text x="32" y="260" font-size="28" text-anchor="start" font-weight="700" fill="#182638">定时方式：三张卡各自选择</text><rect x="32" y="288" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="288" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="317" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="353" font-size="28" text-anchor="start" font-weight="700" fill="#182638">/loop</text><text x="52" y="384" font-size="24" text-anchor="start" font-weight="400" fill="#182638">需要保持当前会话打开</text><rect x="32" y="430" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="430" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="459" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="495" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Desktop 定时任务</text><text x="52" y="526" font-size="24" text-anchor="start" font-weight="400" fill="#182638">本地机器保持开启，无需会话打开</text><rect x="32" y="572" width="576" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="572" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="601" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="637" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Cloud routines</text><text x="52" y="668" font-size="24" text-anchor="start" font-weight="400" fill="#182638">云端运行，无需本地机器在线</text><rect x="32" y="732" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="767" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">再次启动后，仍要核对当前任务、权限</text><text x="50" y="801" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">与外部状态；定时启动不等于正确完成。</text><path d="M32,843 L608,843" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="862" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="880" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="862" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="880" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="862" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="880" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="862" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="880" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>