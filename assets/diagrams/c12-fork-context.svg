<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1268" viewBox="0 0 640 1268" role="img" aria-labelledby="title desc">
<title id="title">runAgent：复用循环，另建上下文</title><desc id="desc">2.1.88 历史快照 · 静态阅读，非沙箱证明；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1268" fill="#ffffff"/>
