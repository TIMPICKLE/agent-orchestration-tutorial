<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1075" viewBox="0 0 640 1075" role="img" aria-labelledby="title desc">
<title id="title">沿两个节点，看状态字段变化</title><desc id="desc">issue保持不变；candidate与passed被更新；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1075" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">沿两个节点，看状态字段变化</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">issue保持不变；candidate与passed被更新</text><circle cx="58" cy="167" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="176" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">0</text><rect x="101" y="125" width="507" height="188" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="121" y="165" font-size="28" text-anchor="start" font-weight="700" fill="#182638">初始状态</text><text x="121" y="204" font-size="26" text-anchor="start" font-weight="400" fill="#182638">issue = demo-1042</text><text x="121" y="240" font-size="26" text-anchor="start" font-weight="400" fill="#182638">candidate = 空</text><text x="121" y="276" font-size="26" text-anchor="start" font-weight="400" fill="#182638">passed = False</text><path d="M320,313 L320,349" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="339.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">局部更新，其他字段保留</text><circle cx="58" cy="402" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="411" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">1</text><rect x="101" y="360" width="507" height="188" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="121" y="400" font-size="28" text-anchor="start" font-weight="700" fill="#182638">propose之后</text><text x="121" y="439" font-size="26" text-anchor="start" font-weight="400" fill="#182638">issue = demo-1042</text><text x="121" y="475" font-size="26" text-anchor="start" font-weight="400" fill="#182638">candidate = 候选</text><text x="121" y="511" font-size="26" text-anchor="start" font-weight="400" fill="#182638">passed = False</text><path d="M320,548 L320,584" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="574.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">局部更新，其他字段保留</text><circle cx="58" cy="637" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="646" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="101" y="595" width="507" height="188" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="121" y="635" font-size="28" text-anchor="start" font-weight="700" fill="#182638">verify之后</text><text x="121" y="674" font-size="26" text-anchor="start" font-weight="400" fill="#182638">issue = demo-1042</text><text x="121" y="710" font-size="26" text-anchor="start" font-weight="400" fill="#182638">candidate = 候选</text><text x="121" y="746" font-size="26" text-anchor="start" font-weight="400" fill="#182638">passed = 比较结果</text><path d="M320,784 L320,829" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="814.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">无条件结束边</text><rect x="32" y="840" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="875" font-size="28" text-anchor="start" font-weight="700" fill="#126653">END：结束，但未必成功</text><text x="32" y="980" font-size="24" text-anchor="start" font-weight="400" fill="#182638">玩具比较结果，不证明真实解析函数正确。</text><path d="M32,1007 L608,1007" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="1026" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="1044" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="1026" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="1044" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="1026" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="1044" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="1026" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="1044" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>