<svg xmlns="http://www.w3.org/2000/svg" width="640" height="778" viewBox="0 0 640 778" role="img" aria-labelledby="title desc">
<title id="title">提示词之外，还要有执行门禁</title><desc id="desc">模型的动作建议，不等于已经获准执行；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="778" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">提示词之外，还要有执行门禁</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">模型的动作建议，不等于已经获准执行</text><rect x="64" y="125" width="512" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="64" y="125" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="84" y="154" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="84" y="190" font-size="28" text-anchor="start" font-weight="700" fill="#182638">建议 read_file(path)</text><text x="84" y="221" font-size="24" text-anchor="start" font-weight="400" fill="#182638">模型提交动作与参数</text><path d="M320,237 L320,281" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="267.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">待检查的请求</text><rect x="64" y="292" width="512" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="64" y="292" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="84" y="321" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="84" y="357" font-size="28" text-anchor="start" font-weight="700" fill="#182638">工具名单 + 参数范围</text><text x="84" y="388" font-size="24" text-anchor="start" font-weight="400" fill="#182638">程序检查真实路径与任务权限</text><path d="M320,405 L320,450 L170,450 L170,487" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,450 L470,450 L470,487" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="168" y="442" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">允许</text><text x="474" y="442" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">拒绝</text><rect x="32" y="501" width="276" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="501" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="530" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="566" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行工具</text><text x="52" y="597" font-size="24" text-anchor="start" font-weight="400" fill="#182638">返回实际结果</text><rect x="332" y="501" width="276" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="332" y="501" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="352" y="530" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="352" y="566" font-size="28" text-anchor="start" font-weight="700" fill="#182638">结构化原因</text><text x="352" y="597" font-size="24" text-anchor="start" font-weight="400" fill="#182638">缩小范围或申请授权</text><rect x="32" y="639" width="576" height="58" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="674" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">提示词解释意图；执行门禁限制动作。</text><path d="M32,710 L608,710" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="729" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="747" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="729" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="747" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="729" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="747" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="729" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="747" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>