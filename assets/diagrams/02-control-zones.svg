<svg xmlns="http://www.w3.org/2000/svg" width="640" height="940" viewBox="0 0 640 940" role="img" aria-labelledby="title desc">
<title id="title">谁决定下一步：两层控制</title><desc id="desc">程序选阶段；模型在阶段内选择工具；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="940" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">谁决定下一步：两层控制</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">程序选阶段；模型在阶段内选择工具</text><rect x="32" y="122" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="122" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="151" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="187" font-size="28" text-anchor="start" font-weight="700" fill="#182638">进入修复阶段</text><text x="52" y="218" font-size="24" text-anchor="start" font-weight="400" fill="#182638">外层决定阶段，并检查预算</text><path d="M320,234 L320,276" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="263.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">交付目标与边界</text><rect x="32" y="285" width="576" height="314" rx="16" fill="#f7f9fc" stroke="#ced8e5" stroke-width="2" stroke-dasharray="7 5"/><text x="52" y="323" font-size="26" text-anchor="start" font-weight="700" fill="#182638">阶段内部：受限探索</text><rect x="68" y="342" width="404" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="68" y="342" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="88" y="371" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="88" y="407" font-size="28" text-anchor="start" font-weight="700" fill="#182638">选择下一次工具</text><text x="88" y="438" font-size="24" text-anchor="start" font-weight="400" fill="#182638">读文件？改代码？运行测试？</text><path d="M320,454 L320,488" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="479.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">建议动作</text><rect x="68" y="492" width="404" height="88" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="68" y="492" width="7" height="88" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="88" y="516" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="88" y="545" font-size="28" text-anchor="start" font-weight="700" fill="#182638">校验后执行工具</text><text x="88" y="574" font-size="24" text-anchor="start" font-weight="400" fill="#182638">返回具体观察结果</text><path d="M472,536 L567,536 L567,397 L480,397" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="499" y="477" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">反馈</text><path d="M320,599 L320,634" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="624.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">提交阶段结果与证据</text><rect x="32" y="642" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="677" font-size="28" text-anchor="start" font-weight="700" fill="#126653">程序验收 → 选择下一阶段</text><rect x="32" y="751" width="576" height="112" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="32" y="751" width="7" height="112" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="52" y="780" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="52" y="816" font-size="28" text-anchor="start" font-weight="700" fill="#182638">遇到新权限：等待人</text><text x="52" y="847" font-size="24" text-anchor="start" font-weight="400" fill="#182638">不能靠继续推理跨过审批边界</text><path d="M32,872 L608,872" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="891" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="909" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="891" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="909" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="891" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="909" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="891" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="909" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>