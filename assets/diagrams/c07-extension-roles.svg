<svg xmlns="http://www.w3.org/2000/svg" width="640" height="871" viewBox="0 0 640 871" role="img" aria-labelledby="title desc">
<title id="title">四种扩展，各自改变什么</title><desc id="desc">按需要选部件，不把它们看成同一条流程；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="871" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">四种扩展，各自改变什么</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">按需要选部件，不把它们看成同一条流程</text><rect x="32" y="132" width="276" height="152" rx="16" fill="#f3f5f7" stroke="none" stroke-width="2"/><rect x="32" y="132" width="7" height="152" rx="3" fill="#4a5768" stroke="none" stroke-width="2"/><text x="52" y="161" font-size="22" text-anchor="start" font-weight="700" fill="#4a5768">任务信息</text><text x="52" y="197" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Skill</text><text x="52" y="228" font-size="24" text-anchor="start" font-weight="400" fill="#182638">按需提供工作指令</text><text x="52" y="262" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">补充步骤与知识</text><rect x="332" y="132" width="276" height="152" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="332" y="132" width="7" height="152" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="352" y="161" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="352" y="197" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Hook</text><text x="352" y="228" font-size="24" text-anchor="start" font-weight="400" fill="#182638">在生命周期事件运行</text><text x="352" y="262" font-size="24" text-anchor="start" font-weight="400" fill="#126653">触发预设处理</text><rect x="32" y="328" width="276" height="152" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="328" width="7" height="152" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="357" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="393" font-size="28" text-anchor="start" font-weight="700" fill="#182638">MCP</text><text x="52" y="424" font-size="24" text-anchor="start" font-weight="400" fill="#182638">连接外部能力与数据</text><text x="52" y="458" font-size="24" text-anchor="start" font-weight="400" fill="#684699">提供工具与资源连接</text><rect x="332" y="328" width="276" height="152" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="332" y="328" width="7" height="152" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="352" y="357" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="352" y="393" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Subagent</text><text x="352" y="424" font-size="24" text-anchor="start" font-weight="400" fill="#182638">委派有限子任务</text><text x="352" y="458" font-size="24" text-anchor="start" font-weight="400" fill="#2856a3">通常有独立上下文</text><rect x="32" y="526" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="561" font-size="28" text-anchor="start" font-weight="700" fill="#126653">共同边界：运行时与权限约束</text><text x="52" y="592" font-size="24" text-anchor="start" font-weight="400" fill="#182638">扩展能力本身，不等于业务验收</text><rect x="32" y="644" width="576" height="92" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="679" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">fork 可继承起始历史；</text><text x="50" y="713" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">不要假定多个子代理始终共享全部状态。</text><path d="M32,803 L608,803" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="822" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="840" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="822" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="840" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="822" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="840" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="822" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="840" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>