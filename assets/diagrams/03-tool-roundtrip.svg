<svg xmlns="http://www.w3.org/2000/svg" width="640" height="924" viewBox="0 0 640 924" role="img" aria-labelledby="title desc">
<title id="title">工具请求怎样变成真实执行</title><desc id="desc">模型提出请求；运行时与工具端真正执行；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="924" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">工具请求怎样变成真实执行</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">模型提出请求；运行时与工具端真正执行</text><rect x="52" y="126" width="536" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="52" y="126" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="72" y="155" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="72" y="191" font-size="28" text-anchor="start" font-weight="700" fill="#182638">请求 run_tests(target)</text><text x="72" y="222" font-size="24" text-anchor="start" font-weight="400" fill="#182638">产生结构化工具调用</text><path d="M320,238 L320,289" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="271.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">调用请求</text><rect x="52" y="296" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="296" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="361" font-size="28" text-anchor="start" font-weight="700" fill="#182638">映射函数、校验参数</text><text x="72" y="392" font-size="24" text-anchor="start" font-weight="400" fill="#182638">核对权限和当前任务范围</text><path d="M320,408 L320,459" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="441.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">允许执行</text><rect x="52" y="466" width="536" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="52" y="466" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="72" y="495" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="72" y="531" font-size="28" text-anchor="start" font-weight="700" fill="#182638">工具实际执行</text><text x="72" y="562" font-size="24" text-anchor="start" font-weight="400" fill="#182638">返回退出码与测试输出</text><path d="M320,578 L320,629" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="611.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">调用ID + 结果</text><rect x="52" y="636" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="636" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="665" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="701" font-size="28" text-anchor="start" font-weight="700" fill="#182638">关联原调用，进入下一轮</text><text x="72" y="732" font-size="24" text-anchor="start" font-weight="400" fill="#182638">具体结果成为新的模型输入</text><text x="32" y="830" font-size="26" text-anchor="start" font-weight="700" fill="#182638">只说“我会测试”，不会自动执行工具。</text><path d="M32,856 L608,856" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="875" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="893" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="875" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="893" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="875" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="893" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="875" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="893" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>