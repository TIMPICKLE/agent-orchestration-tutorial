<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
<title id="title">收到、唤醒、执行、成功</title><desc id="desc">四个阶段，各自需要可核验的证据；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">收到、唤醒、执行、成功</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">四个阶段，各自需要可核验的证据</text><circle cx="58" cy="170" r="22" fill="#f1ebfa" stroke="#684699" stroke-width="2"/><text x="58" y="179" font-size="26" text-anchor="middle" font-weight="700" fill="#684699">1</text><rect x="104" y="122" width="504" height="108" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="104" y="122" width="7" height="108" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="124" y="151" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="124" y="187" font-size="28" text-anchor="start" font-weight="700" fill="#182638">事件收到</text><text x="124" y="218" font-size="24" text-anchor="start" font-weight="400" fill="#182638">入口保存事件与关联 ID</text><path d="M58,194 L58,276" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="302" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="311" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="104" y="254" width="504" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="104" y="254" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="124" y="283" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="124" y="319" font-size="28" text-anchor="start" font-weight="700" fill="#182638">运行被唤醒</text><text x="124" y="350" font-size="24" text-anchor="start" font-weight="400" fill="#182638">建立或恢复对应 run_id</text><path d="M58,326 L58,408" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="434" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="443" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">3</text><rect x="104" y="386" width="504" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="104" y="386" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="124" y="415" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="124" y="451" font-size="28" text-anchor="start" font-weight="700" fill="#182638">动作已执行</text><text x="124" y="482" font-size="24" text-anchor="start" font-weight="400" fill="#182638">工具留下动作与结果记录</text><path d="M58,458 L58,540" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="566" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="575" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">4</text><rect x="104" y="518" width="504" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="104" y="518" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="124" y="547" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="124" y="583" font-size="28" text-anchor="start" font-weight="700" fill="#182638">任务成功</text><text x="124" y="614" font-size="24" text-anchor="start" font-weight="400" fill="#182638">当前产物满足验收标准</text><rect x="32" y="674" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="709" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">HTTP 200 和 Run 结束，都不能</text><text x="50" y="743" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">单独证明业务任务已经成功。</text><path d="M32,792 L608,792" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="811" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="811" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="811" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="811" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>