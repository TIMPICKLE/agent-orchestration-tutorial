<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc">
<title id="title">长期任务，可以经历短运行</title><desc id="desc">Multica：身份、Issue 与 Run 分开；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="880" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">长期任务，可以经历短运行</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Multica：身份、Issue 与 Run 分开</text><rect x="32" y="120" width="576" height="86" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><text x="52" y="155" font-size="28" text-anchor="start" font-weight="700" fill="#2856a3">Agent：长期身份、owner 与配置</text><text x="52" y="186" font-size="24" text-anchor="start" font-weight="400" fill="#182638">一次运行结束，不会抹掉这个身份</text><rect x="32" y="225" width="576" height="86" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><text x="52" y="260" font-size="28" text-anchor="start" font-weight="700" fill="#684699">Issue：长期目标、讨论与进度</text><text x="52" y="291" font-size="24" text-anchor="start" font-weight="400" fill="#182638">多个 Agent 与多次 Run 可参与同一任务</text><path d="M76,348 L76,692" fill="none" stroke="#4a5768" stroke-width="2.5" marker-end="url(#arrow)"/><text x="34" y="716" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">时间</text><circle cx="76" cy="387" r="21" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="76" y="396" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">1</text><rect x="128" y="340" width="480" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="340" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="369" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="405" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Run 1 · leader</text><text x="148" y="436" font-size="24" text-anchor="start" font-weight="400" fill="#182638">委派后结束本轮</text><circle cx="76" cy="513" r="21" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="76" y="522" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="128" y="466" width="480" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="466" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="495" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="531" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Run 2 · 成员</text><text x="148" y="562" font-size="24" text-anchor="start" font-weight="400" fill="#182638">执行子任务并交结果</text><circle cx="76" cy="639" r="21" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="76" y="648" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">3</text><rect x="128" y="592" width="480" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="592" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="621" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="657" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Run 3 · leader</text><text x="148" y="688" font-size="24" text-anchor="start" font-weight="400" fill="#182638">相关事件触发新一轮汇总</text><rect x="32" y="727" width="576" height="58" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="762" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">Run 结束，仍需判断 Issue 是否达标。</text><path d="M32,812 L608,812" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="831" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="831" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="831" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="831" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>