<svg xmlns="http://www.w3.org/2000/svg" width="640" height="738" viewBox="0 0 640 738" role="img" aria-labelledby="title desc">
<title id="title">四个身份，分别核对</title><desc id="desc">可以由同一人兼任，不能直接等同；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="738" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">四个身份，分别核对</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">可以由同一人兼任，不能直接等同</text><rect x="32" y="132" width="276" height="142" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="32" y="132" width="7" height="142" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="52" y="161" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="52" y="197" font-size="28" text-anchor="start" font-weight="700" fill="#182638">请求者</text><text x="52" y="228" font-size="24" text-anchor="start" font-weight="400" fill="#182638">谁提出这项工作？</text><rect x="332" y="132" width="276" height="142" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="332" y="132" width="7" height="142" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="352" y="161" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="352" y="197" font-size="28" text-anchor="start" font-weight="700" fill="#182638">资产 owner</text><text x="352" y="228" font-size="24" text-anchor="start" font-weight="400" fill="#182638">仓库与连接属于谁？</text><rect x="32" y="356" width="276" height="142" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="356" width="7" height="142" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="385" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="421" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行 Agent</text><text x="52" y="452" font-size="24" text-anchor="start" font-weight="400" fill="#182638">谁承担具体工作？</text><rect x="332" y="356" width="276" height="142" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="332" y="356" width="7" height="142" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="352" y="385" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="352" y="421" font-size="28" text-anchor="start" font-weight="700" fill="#182638">审批者</text><text x="352" y="452" font-size="24" text-anchor="start" font-weight="400" fill="#182638">谁能批准目标动作？</text><path d="M170,274 L170,356" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190" y="324" font-size="24" text-anchor="start" font-weight="400" fill="#182638">分配</text><path d="M470,274 L470,356" fill="none" stroke="#68778a" stroke-width="2.5" stroke-dasharray="7 5"/><text x="368" y="324" font-size="24" text-anchor="start" font-weight="400" fill="#182638">另行核对</text><path d="M332,427 L308,427" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="544" width="576" height="92" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="579" font-size="24" text-anchor="start" font-weight="400" fill="#126653">执行前核对实际账户、目标与权限。</text><text x="50" y="613" font-size="24" text-anchor="start" font-weight="400" fill="#126653">能发任务，不代表能借用全部凭据。</text><path d="M32,670 L608,670" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="689" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="707" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="689" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="707" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="689" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="707" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="689" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="707" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>