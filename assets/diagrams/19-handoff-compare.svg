<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
<title id="title">调用、通知、交接控制</title><desc id="desc">三个协议，三种不同的责任关系；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="790" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">调用、通知、交接控制</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">三个协议，三种不同的责任关系</text><text x="32" y="136" font-size="28" text-anchor="start" font-weight="700" fill="#182638">① 工具调用：等专家返回</text><rect x="32" y="160" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="160" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="184" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="213" font-size="28" text-anchor="start" font-weight="700" fill="#182638">管理者</text><rect x="390" y="160" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="390" y="160" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="410" y="184" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="410" y="213" font-size="28" text-anchor="start" font-weight="700" fill="#182638">专家</text><path d="M250,187 L390,187" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="174" font-size="24" text-anchor="start" font-weight="400" fill="#182638">调用</text><path d="M390,230 L250,230" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="290" y="262" font-size="24" text-anchor="start" font-weight="400" fill="#182638">返回</text><text x="32" y="316" font-size="28" text-anchor="start" font-weight="700" fill="#182638">② 通知：传信息，不代表接管</text><rect x="32" y="340" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="340" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="364" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="393" font-size="28" text-anchor="start" font-weight="700" fill="#182638">发送者</text><rect x="390" y="340" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="390" y="340" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="410" y="364" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="410" y="393" font-size="28" text-anchor="start" font-weight="700" fill="#182638">接收者</text><path d="M250,386 L390,386" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="278" y="369" font-size="24" text-anchor="start" font-weight="400" fill="#182638">消息</text><text x="32" y="496" font-size="28" text-anchor="start" font-weight="700" fill="#182638">③ handoff：接收者继续当前运行</text><rect x="32" y="520" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="520" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="544" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="573" font-size="28" text-anchor="start" font-weight="700" fill="#182638">分诊助手</text><rect x="390" y="520" width="218" height="92" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="390" y="520" width="7" height="92" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="410" y="544" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="410" y="573" font-size="28" text-anchor="start" font-weight="700" fill="#182638">验收助手</text><path d="M250,566 L390,566" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="270" y="548" font-size="24" text-anchor="start" font-weight="400" fill="#182638">控制权</text><rect x="32" y="645" width="576" height="58" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="680" font-size="24" text-anchor="start" font-weight="400" fill="#126653">业务负责人和权限仍由应用定义。</text><path d="M32,722 L608,722" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="741" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="759" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="741" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="759" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="741" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="759" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="741" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="759" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>