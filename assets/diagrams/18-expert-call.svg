<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc">
<title id="title">专家返回，管理者继续</title><desc id="desc">子任务调用：整体责任仍在管理者；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="740" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">专家返回，管理者继续</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">子任务调用：整体责任仍在管理者</text><rect x="32" y="130" width="264" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="130" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="159" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="195" font-size="28" text-anchor="start" font-weight="700" fill="#182638">管理者</text><text x="52" y="226" font-size="24" text-anchor="start" font-weight="400" fill="#182638">负责工单 1042</text><rect x="344" y="296" width="264" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="344" y="296" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="364" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="364" y="361" font-size="28" text-anchor="start" font-weight="700" fill="#182638">只读审查专家</text><text x="364" y="392" font-size="24" text-anchor="start" font-weight="400" fill="#182638">返回发现与证据</text><rect x="32" y="462" width="264" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="462" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="491" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="527" font-size="28" text-anchor="start" font-weight="700" fill="#182638">管理者继续</text><text x="52" y="558" font-size="24" text-anchor="start" font-weight="400" fill="#182638">修复、验证或报告</text><path d="M296,186 L320,186 L320,352 L344,352" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="46" y="278" font-size="24" text-anchor="start" font-weight="400" fill="#182638">调用：问题、候选、证据</text><path d="M344,380 L322,380 L322,518 L296,518" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="352" y="446" font-size="24" text-anchor="start" font-weight="400" fill="#182638">结果回到管理者</text><rect x="32" y="594" width="576" height="58" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="629" font-size="24" text-anchor="start" font-weight="400" fill="#126653">必须审查？由程序设为必经步骤。</text><path d="M32,672 L608,672" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="691" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="709" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="691" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="709" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="691" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="709" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="691" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="709" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>