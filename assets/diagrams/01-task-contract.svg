t="106" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="122" y="402" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="122" y="438" font-size="28" text-anchor="start" font-weight="700" fill="#182638">证据</text><text x="122" y="469" font-size="24" text-anchor="start" font-weight="400" fill="#182638">当前版本的测试记录</text><circle cx="59" cy="545" r="22" fill="#fff3d9" stroke="#885800" stroke-width="2"/><text x="59" y="554" font-size="26" text-anchor="middle" font-weight="700" fill="#885800">4</text><rect x="102" y="497" width="506" height="106" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="102" y="497" width="7" height="106" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="122" y="526" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="122" y="562" font-size="28" text-anchor="start" font-weight="700" fill="#182638">权限</text><text x="122" y="593" font-size="24" text-anchor="start" font-weight="400" fill="#182638">工作区修改；发布另批</text><text x="32" y="657" font-size="26" text-anchor="start" font-weight="700" fill="#182638">测试通过，不能自动扩大允许动作。</text><path d="M32,674 L608,674" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="693" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="711" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="693" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="711" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="693" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="711" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="693" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="711" font-size="22" text-anchor="start" font-w