<svg xmlns="http://www.w3.org/2000/svg" width="640" height="811" viewBox="0 0 640 811" role="img" aria-labelledby="title desc">
<title id="title">外层生命周期与内层求解，分开选</title><desc id="desc">外层固定，并不排斥内层自主；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="811" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">外层生命周期与内层求解，分开选</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">外层固定，并不排斥内层自主</text><rect x="32" y="125" width="576" height="445" rx="16" fill="#f7f9fc" stroke="#b9c8d8" stroke-width="2" stroke-dasharray="7 5"/><text x="52" y="166" font-size="28" text-anchor="start" font-weight="700" fill="#182638">外层：接单 → 阶段 → 收尾</text><text x="52" y="210" font-size="24" text-anchor="start" font-weight="400" fill="#182638">程序管理生命周期与交付边界</text><text x="52" y="266" font-size="26" text-anchor="start" font-weight="700" fill="#182638">内层执行单元，可以分别选择：</text><rect x="62" y="295" width="516" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="62" y="295" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="82" y="324" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="82" y="360" font-size="28" text-anchor="start" font-weight="700" fill="#182638">选择A：固定函数</text><text x="82" y="391" font-size="24" text-anchor="start" font-weight="400" fill="#182638">已知规则，确定执行步骤</text><rect x="62" y="435" width="516" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="62" y="435" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="82" y="464" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="82" y="500" font-size="28" text-anchor="start" font-weight="700" fill="#182638">选择B：工具反馈循环</text><text x="82" y="531" font-size="24" text-anchor="start" font-weight="400" fill="#182638">未知路径，允许受限探索</text><rect x="32" y="611" width="576" height="92" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="646" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">先写清任务与验收，再选择组合。</text><text x="50" y="680" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">图示是设计选项，不是仓库实现清单。</text><path d="M32,743 L608,743" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="762" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="780" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="762" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="780" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="762" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="780" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="762" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="780" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>