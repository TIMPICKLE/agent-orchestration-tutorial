<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc">
<title id="title">失败后是否再试，要明确设计</title><desc id="desc">比较“只试一次”和“根据反馈再修改”；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="850" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">失败后是否再试，要明确设计</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">比较“只试一次”和“根据反馈再修改”</text><text x="32" y="147" font-size="28" text-anchor="start" font-weight="700" fill="#182638">A  固定流程：测试后报告</text><rect x="32" y="171" width="176" height="88" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="171" width="7" height="88" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="195" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="224" font-size="28" text-anchor="start" font-weight="700" fill="#182638">提出补丁</text><path d="M209,215 L227,215" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="232" y="171" width="176" height="88" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="232" y="171" width="7" height="88" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="252" y="195" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="252" y="224" font-size="28" text-anchor="start" font-weight="700" fill="#182638">测试</text><path d="M409,215 L427,215" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="432" y="171" width="176" height="88" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="432" y="171" width="7" height="88" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="452" y="195" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="452" y="224" font-size="28" text-anchor="start" font-weight="700" fill="#182638">报告</text><rect x="32" y="282" width="576" height="58" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="317" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">测试失败也正常报告：只承诺尝试一次。</text><text x="32" y="426" font-size="28" text-anchor="start" font-weight="700" fill="#182638">B  反馈流程：失败时带回证据</text><rect x="32" y="454" width="252" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="454" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="483" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="519" font-size="28" text-anchor="start" font-weight="700" fill="#182638">提出补丁</text><text x="52" y="550" font-size="24" text-anchor="start" font-weight="400" fill="#182638">新的候选版本</text><rect x="356" y="454" width="252" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="356" y="454" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="376" y="483" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="376" y="519" font-size="28" text-anchor="start" font-weight="700" fill="#182638">测试</text><text x="376" y="550" font-size="24" text-anchor="start" font-weight="400" fill="#182638">具体断言结果</text><path d="M285,510 L348,510" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M481,567 L481,635 L158,635 L158,574" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="624" font-size="26" text-anchor="middle" font-weight="400" fill="#182638">失败 + 预算允许</text><rect x="32" y="681" width="576" height="58" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="716" font-size="24" text-anchor="start" font-weight="400" fill="#126653">通过 → 报告；预算耗尽 → 报告阻塞。</text><path d="M32,782 L608,782" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="801" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="819" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="801" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="819" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="801" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="819" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="801" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="819" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>