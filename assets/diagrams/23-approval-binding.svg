<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
<title id="title">批准必须绑定具体版本</title><desc id="desc">人、动作、对象、版本，缺一不可；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">批准必须绑定具体版本</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">人、动作、对象、版本，缺一不可</text><rect x="32" y="120" width="576" height="224" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><text x="52" y="155" font-size="28" text-anchor="start" font-weight="700" fill="#885800">人工决定 · 审批卡</text><text x="52" y="199" font-size="26" text-anchor="start" font-weight="400" fill="#182638">批准者：具备该动作权限的人</text><text x="52" y="239" font-size="26" text-anchor="start" font-weight="400" fill="#182638">动作：create_draft_pr</text><text x="52" y="279" font-size="26" text-anchor="start" font-weight="400" fill="#182638">对象：demo-repository</text><text x="52" y="319" font-size="26" text-anchor="start" font-weight="700" fill="#182638">绑定候选：A</text><path d="M320,344 L320,380" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="390" width="268" height="112" rx="16" fill="#f3f5f7" stroke="none" stroke-width="2"/><rect x="32" y="390" width="7" height="112" rx="3" fill="#4a5768" stroke="none" stroke-width="2"/><text x="52" y="419" font-size="22" text-anchor="start" font-weight="700" fill="#4a5768">任务信息</text><text x="52" y="455" font-size="28" text-anchor="start" font-weight="700" fill="#182638">当前候选 B</text><text x="52" y="486" font-size="24" text-anchor="start" font-weight="400" fill="#182638">与审批绑定版本不同</text><rect x="344" y="390" width="264" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="344" y="390" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="364" y="419" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="364" y="455" font-size="28" text-anchor="start" font-weight="700" fill="#182638">当前任务状态</text><text x="364" y="486" font-size="24" text-anchor="start" font-weight="400" fill="#182638">有效还是已取消？</text><path d="M166,502 L166,536 L320,536 L320,566" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M476,502 L476,536 L320,536" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round"/><rect x="80" y="566" width="480" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="80" y="566" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="100" y="595" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="100" y="631" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行前重新核验</text><text x="100" y="662" font-size="24" text-anchor="start" font-weight="400" fill="#182638">A ≠ B：旧批准不能直接复用</text><rect x="32" y="704" width="576" height="58" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="739" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">任务已取消：记录晚到同意，不执行。</text><path d="M32,792 L608,792" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="811" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="811" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="811" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="811" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>