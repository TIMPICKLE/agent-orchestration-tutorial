<svg xmlns="http://www.w3.org/2000/svg" width="640" height="827" viewBox="0 0 640 827" role="img" aria-labelledby="title desc">
<title id="title">聊天、任务状态、产物各放哪里</title><desc id="desc">三者互相引用，但不能互相替代；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="827" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">聊天、任务状态、产物各放哪里</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">三者互相引用，但不能互相替代</text><rect x="52" y="126" width="536" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="52" y="126" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="72" y="155" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="72" y="191" font-size="28" text-anchor="start" font-weight="700" fill="#182638">对话上下文</text><text x="72" y="222" font-size="24" text-anchor="start" font-weight="400" fill="#182638">为什么这样修改；讨论与观察</text><rect x="52" y="277" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="277" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="306" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="342" font-size="28" text-anchor="start" font-weight="700" fill="#182638">工作流状态</text><text x="72" y="373" font-size="24" text-anchor="start" font-weight="400" fill="#182638">1042 / testing / attempt=1</text><rect x="52" y="428" width="536" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="52" y="428" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="72" y="457" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="72" y="493" font-size="28" text-anchor="start" font-weight="700" fill="#182638">产物与版本</text><text x="72" y="524" font-size="24" text-anchor="start" font-weight="400" fill="#182638">补丁、测试日志、候选版本</text><path d="M32,578 L608,578" fill="none" stroke="#a13325" stroke-width="2.5" stroke-dasharray="7 5"/><text x="320" y="617" font-size="28" text-anchor="middle" font-weight="700" fill="#a13325">假设现在进程退出</text><rect x="32" y="649" width="576" height="92" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="684" font-size="24" text-anchor="start" font-weight="400" fill="#126653">只从进程外保存的状态定位产物。</text><text x="50" y="718" font-size="24" text-anchor="start" font-weight="400" fill="#126653">内存字典不提供跨重启恢复。</text><path d="M32,759 L608,759" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="778" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="796" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="778" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="796" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="778" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="796" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="778" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="796" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>