<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870" role="img" aria-labelledby="title desc">
<title id="title">四种权限边界，分别验证</title><desc id="desc">Multica：调用权不能代替执行限制；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="870" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">四种权限边界，分别验证</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Multica：调用权不能代替执行限制</text><circle cx="58" cy="170" r="22" fill="#fff3d9" stroke="#885800" stroke-width="2"/><text x="58" y="179" font-size="26" text-anchor="middle" font-weight="700" fill="#885800">1</text><rect x="103" y="122" width="505" height="108" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="103" y="122" width="7" height="108" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="123" y="151" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="123" y="187" font-size="28" text-anchor="start" font-weight="700" fill="#182638">启动权限</text><text x="123" y="218" font-size="24" text-anchor="start" font-weight="400" fill="#182638">谁可以启动这个 Agent？</text><path d="M58,194 L58,275" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="301" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="310" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="103" y="253" width="505" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="103" y="253" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="123" y="282" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="123" y="318" font-size="28" text-anchor="start" font-weight="700" fill="#182638">平台 API 身份</text><text x="123" y="349" font-size="24" text-anchor="start" font-weight="400" fill="#182638">这轮 Run 在平台内能做什么？</text><path d="M58,325 L58,406" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="432" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="441" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">3</text><rect x="103" y="384" width="505" height="108" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="103" y="384" width="7" height="108" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="123" y="413" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="123" y="449" font-size="28" text-anchor="start" font-weight="700" fill="#182638">操作系统权限</text><text x="123" y="480" font-size="24" text-anchor="start" font-weight="400" fill="#182638">进程能读写哪里、访问什么网络？</text><path d="M58,456 L58,537" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="58" cy="563" r="22" fill="#f1ebfa" stroke="#684699" stroke-width="2"/><text x="58" y="572" font-size="26" text-anchor="middle" font-weight="700" fill="#684699">4</text><rect x="103" y="515" width="505" height="108" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="103" y="515" width="7" height="108" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="123" y="544" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="123" y="580" font-size="28" text-anchor="start" font-weight="700" fill="#182638">外部连接权限</text><text x="123" y="611" font-size="24" text-anchor="start" font-weight="400" fill="#182638">用谁的账户，以及哪些能力？</text><rect x="32" y="678" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="713" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">该版本默认继承 daemon 系统用户权限。</text><text x="50" y="747" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">不承诺统一沙箱；人审不能补上这道边界。</text><path d="M32,802 L608,802" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="821" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="839" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="821" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="839" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="821" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="839" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="821" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="839" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>