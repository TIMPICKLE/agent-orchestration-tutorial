0,489 L320,489 L320,513" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M438,459 L438,489 L320,489" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round"/><rect x="32" y="526" width="576" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="526" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="555" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="591" font-size="28" text-anchor="start" font-weight="700" fill="#182638">initialMessages：子代理起点</text><text x="52" y="622" font-size="24" text-anchor="start" font-weight="400" fill="#182638">过滤后的可选历史 + promptMessages</text><path d="M320,638 L320,678" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="666.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">建立子代理执行上下文</text><rect x="32" y="690" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="690" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="719" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="755" font-size="28" text-anchor="start" font-weight="700" fill="#182638">createSubagentContext</text><text x="52" y="786" font-size="24" text-anchor="start" font-weight="400" fill="#182638">工具、选项与运行状态分别配置</text><path d="M320,802 L320,842" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="830.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">调用同一核心循环</text><rect x="32" y="854" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="854" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="883" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="919" font-size="28" text-anchor="start" font-weight="700" fill="#182638">复用query，产生消息</text><text x="52" y="950" font-size="24" text-anchor="start" font-weight="400" fill="#182638">runAgent向调用者yield messages</text><rect x="32" y="1000" width="576" height="92" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="1035" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">文件读取状态：fork时克隆，否则新建。</text><text x="50" y="1069" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">消息起点分开，不代表进程或OS隔离。</text><text x="32" y="1152" font-size="24" text-anchor="start" font-weight="400" fill="#182638">不能把早期“仅提示词”的结论套到此版本。</text><path d="M32,1200 L608,1200" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="1219" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="1237" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="1219" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="1237" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="1219" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="1237" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="1219" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="1237" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>