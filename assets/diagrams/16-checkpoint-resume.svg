<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1023" viewBox="0 0 640 1023" role="img" aria-labelledby="title desc">
<title id="title">等待跨执行，恢复找到同一状态</title><desc id="desc">持久恢复设计；不是内存saver的保证；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1023" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">等待跨执行，恢复找到同一状态</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">持久恢复设计；不是内存saver的保证</text><rect x="52" y="123" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="123" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="152" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="188" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行1：保存等待请求</text><text x="72" y="219" font-size="24" text-anchor="start" font-weight="400" fill="#182638">记录待审批对象，然后interrupt</text><path d="M320,235 L320,282" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="266.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">写入进程外存储</text><rect x="52" y="296" width="536" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="52" y="296" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="72" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="72" y="361" font-size="28" text-anchor="start" font-weight="700" fill="#182638">持久存储</text><text x="72" y="392" font-size="24" text-anchor="start" font-weight="400" fill="#182638">thread_id + 检查点 + 请求信息</text><path d="M32,454 L608,454" fill="none" stroke="#a13325" stroke-width="2.5" stroke-dasharray="7 5"/><text x="320" y="495" font-size="28" text-anchor="middle" font-weight="700" fill="#a13325">执行结束，进程可以退出</text><rect x="52" y="542" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="542" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="571" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="607" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行2：验证回复</text><text x="72" y="638" font-size="24" text-anchor="start" font-weight="400" fill="#182638">核对回复人、动作、目标与版本</text><path d="M320,654 L320,698" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="684.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">应用验证通过后</text><rect x="52" y="713" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="713" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="742" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="778" font-size="28" text-anchor="start" font-weight="700" fill="#182638">使用同一标识恢复</text><text x="72" y="809" font-size="24" text-anchor="start" font-weight="400" fill="#182638">找到原任务与检查点，继续执行</text><rect x="32" y="855" width="576" height="92" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="890" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">节点开头可能重跑；副作用仍需去重。</text><text x="50" y="924" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">checkpoint不保证外部动作恰好一次。</text><path d="M32,955 L608,955" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="974" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="992" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="974" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="992" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="974" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="992" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="974" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="992" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>