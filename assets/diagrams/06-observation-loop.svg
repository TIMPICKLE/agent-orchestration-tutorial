<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img" aria-labelledby="title desc">
<title id="title">一轮循环要带回什么</title><desc id="desc">决定 → 执行 → 观察 → 更新，再决定；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="840" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">一轮循环要带回什么</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">决定 → 执行 → 观察 → 更新，再决定</text><rect x="52" y="125" width="462" height="112" rx="16" fill="#f3f5f7" stroke="none" stroke-width="2"/><rect x="52" y="125" width="7" height="112" rx="3" fill="#4a5768" stroke="none" stroke-width="2"/><text x="72" y="154" font-size="22" text-anchor="start" font-weight="700" fill="#4a5768">任务信息</text><text x="72" y="190" font-size="28" text-anchor="start" font-weight="700" fill="#182638">决定：选择下一步</text><text x="72" y="221" font-size="24" text-anchor="start" font-weight="400" fill="#182638">规则决策器或模型都可以</text><path d="M320,237 L320,275" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="264.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">动作</text><rect x="52" y="282" width="462" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="282" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="311" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="347" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行：受限工具</text><text x="72" y="378" font-size="24" text-anchor="start" font-weight="400" fill="#182638">程序校验动作、参数和预算</text><path d="M320,394 L320,432" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="421.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">退出码与日志</text><rect x="52" y="439" width="462" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="52" y="439" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="72" y="468" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="72" y="504" font-size="28" text-anchor="start" font-weight="700" fill="#182638">观察并更新状态</text><text x="72" y="535" font-size="24" text-anchor="start" font-weight="400" fill="#182638">test_failed + 具体断言</text><path d="M514,495 L584,495 L584,181 L522,181" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="566" y="364" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">再选</text><rect x="32" y="619" width="276" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="619" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="648" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="684" font-size="28" text-anchor="start" font-weight="700" fill="#182638">通过：成功出口</text><text x="52" y="715" font-size="24" text-anchor="start" font-weight="400" fill="#182638">保留对应证据</text><rect x="332" y="619" width="276" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="332" y="619" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="352" y="648" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="352" y="684" font-size="28" text-anchor="start" font-weight="700" fill="#182638">耗尽：阻塞出口</text><text x="352" y="715" font-size="24" text-anchor="start" font-weight="400" fill="#182638">说明剩余问题</text><path d="M32,772 L608,772" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="791" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="809" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="791" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="809" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="791" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="809" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="791" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="809" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>