<svg xmlns="http://www.w3.org/2000/svg" width="640" height="877" viewBox="0 0 640 877" role="img" aria-labelledby="title desc">
<title id="title">给自主会话一个可检查的外壳</title><desc id="desc">把探索交给会话，把验收留给明确规则；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="877" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">给自主会话一个可检查的外壳</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">把探索交给会话，把验收留给明确规则</text><rect x="32" y="126" width="576" height="575" rx="16" fill="#f7f9fc" stroke="#b9c8d8" stroke-width="2" stroke-dasharray="7 5"/><text x="52" y="166" font-size="26" text-anchor="start" font-weight="700" fill="#182638">外层：预算、结果存储、独立验收</text><rect x="65" y="195" width="510" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="65" y="195" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="85" y="224" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="85" y="260" font-size="28" text-anchor="start" font-weight="700" fill="#182638">输入契约</text><text x="85" y="291" font-size="24" text-anchor="start" font-weight="400" fill="#182638">目标 / 允许范围 / 基线版本</text><path d="M320,307 L320,349" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="336.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">进入执行会话</text><rect x="65" y="360" width="510" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="65" y="360" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="85" y="389" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="85" y="425" font-size="28" text-anchor="start" font-weight="700" fill="#182638">会话内部自主探索</text><text x="85" y="456" font-size="24" text-anchor="start" font-weight="400" fill="#182638">读 → 改 → 测 → 根据反馈再选</text><path d="M320,472 L320,514" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="501.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">返回产物与证据引用</text><rect x="65" y="525" width="510" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="65" y="525" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="85" y="554" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="85" y="590" font-size="28" text-anchor="start" font-weight="700" fill="#182638">输出交付包</text><text x="85" y="621" font-size="24" text-anchor="start" font-weight="400" fill="#182638">候选 + 版本 + 证据引用</text><rect x="32" y="733" width="576" height="58" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="768" font-size="24" text-anchor="start" font-weight="400" fill="#126653">外层判断：成功、返工，或明确阻塞。</text><path d="M32,809 L608,809" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="828" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="846" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="828" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="846" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="828" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="846" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="828" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="846" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>