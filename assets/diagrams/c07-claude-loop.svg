<svg xmlns="http://www.w3.org/2000/svg" width="640" height="798" viewBox="0 0 640 798" role="img" aria-labelledby="title desc">
<title id="title">Claude Code：模型选，运行时做</title><desc id="desc">依据官方文档概念化，并非内部函数调用图；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="798" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">Claude Code：模型选，运行时做</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">依据官方文档概念化，并非内部函数调用图</text><rect x="32" y="136" width="264" height="112" rx="16" fill="#f3f5f7" stroke="none" stroke-width="2"/><rect x="32" y="136" width="7" height="112" rx="3" fill="#4a5768" stroke="none" stroke-width="2"/><text x="52" y="165" font-size="22" text-anchor="start" font-weight="700" fill="#4a5768">任务信息</text><text x="52" y="201" font-size="28" text-anchor="start" font-weight="700" fill="#182638">当前上下文</text><text x="52" y="232" font-size="24" text-anchor="start" font-weight="400" fill="#182638">运行时组装本轮输入</text><rect x="344" y="136" width="264" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="344" y="136" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="364" y="165" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="364" y="201" font-size="28" text-anchor="start" font-weight="700" fill="#182638">模型选择工具</text><text x="364" y="232" font-size="24" text-anchor="start" font-weight="400" fill="#182638">依据目标与已有观察</text><path d="M296,192 L344,192" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="344" y="350" width="264" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="344" y="350" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="364" y="379" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="364" y="415" font-size="28" text-anchor="start" font-weight="700" fill="#182638">运行支架</text><text x="364" y="446" font-size="24" text-anchor="start" font-weight="400" fill="#182638">权限策略与执行安排</text><rect x="32" y="350" width="264" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="350" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="379" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="415" font-size="28" text-anchor="start" font-weight="700" fill="#182638">工具与环境</text><text x="52" y="446" font-size="24" text-anchor="start" font-weight="400" fill="#182638">执行并返回观察</text><path d="M476,248 L476,350" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="490" y="310" font-size="24" text-anchor="start" font-weight="400" fill="#182638">工具请求</text><path d="M344,406 L296,406" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M164,350 L164,248" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="38" y="310" font-size="24" text-anchor="start" font-weight="400" fill="#182638">观察反馈</text><rect x="32" y="516" width="576" height="86" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><text x="52" y="551" font-size="28" text-anchor="start" font-weight="700" fill="#684699">会话记录：与当前上下文分开</text><text x="52" y="582" font-size="24" text-anchor="start" font-weight="400" fill="#182638">本轮所见，不等于完整历史始终放入</text><rect x="32" y="630" width="576" height="92" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="665" font-size="24" text-anchor="start" font-weight="400" fill="#126653">权限策略不等于每次工具调用都弹窗。</text><text x="50" y="699" font-size="24" text-anchor="start" font-weight="400" fill="#126653">记录留存与上下文管理，是不同职责。</text><path d="M32,730 L608,730" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="749" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="767" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="749" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="767" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="749" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="767" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="749" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="767" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>