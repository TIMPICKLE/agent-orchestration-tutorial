<svg xmlns="http://www.w3.org/2000/svg" width="640" height="810" viewBox="0 0 640 810" role="img" aria-labelledby="title desc">
<title id="title">并行之后，先对齐再汇总</title><desc id="desc">示例：两个必需的只读审查任务；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="810" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">并行之后，先对齐再汇总</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">示例：两个必需的只读审查任务</text><rect x="184" y="125" width="272" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="184" y="125" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="204" y="154" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="204" y="190" font-size="28" text-anchor="start" font-weight="700" fill="#182638">同一候选 B</text><text x="204" y="221" font-size="24" text-anchor="start" font-weight="400" fill="#182638">先核对范围与预算</text><path d="M320,237 L320,267 L172,267 L172,296" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,267 L468,267 L468,296" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="296" width="280" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="296" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="361" font-size="28" text-anchor="start" font-weight="700" fill="#182638">格式审查完成</text><text x="52" y="392" font-size="24" text-anchor="start" font-weight="400" fill="#182638">版本 B · 有证据</text><rect x="328" y="296" width="280" height="112" rx="16" fill="#ffefec" stroke="none" stroke-width="2"/><rect x="328" y="296" width="7" height="112" rx="3" fill="#a13325" stroke="none" stroke-width="2"/><text x="348" y="325" font-size="22" text-anchor="start" font-weight="700" fill="#a13325">风险</text><text x="348" y="361" font-size="28" text-anchor="start" font-weight="700" fill="#182638">覆盖审查超时</text><text x="348" y="392" font-size="24" text-anchor="start" font-weight="400" fill="#182638">必需结果仍缺失</text><path d="M172,408 L172,456 L320,456 L320,485" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M468,408 L468,456 L320,456" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="96" y="485" width="448" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="96" y="485" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="116" y="514" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="116" y="550" font-size="28" text-anchor="start" font-weight="700" fill="#182638">程序汇总检查</text><text x="116" y="581" font-size="24" text-anchor="start" font-weight="400" fill="#182638">版本一致？证据齐全？存在冲突？</text><path d="M320,597 L320,627" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="633" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="668" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">保留已完成结果，并报告缺失。</text><text x="50" y="702" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">必需分支未完成，不能判整体成功。</text><path d="M32,742 L608,742" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="761" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="779" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="761" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="779" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="761" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="779" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="761" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="779" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>