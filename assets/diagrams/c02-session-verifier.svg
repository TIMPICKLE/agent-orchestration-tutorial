<svg xmlns="http://www.w3.org/2000/svg" width="640" height="860" viewBox="0 0 640 860" role="img" aria-labelledby="title desc">
<title id="title">保留自主会话，补交付核验</title><desc id="desc">Pure Agent Drive：当前事实与新增建议；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="860" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">保留自主会话，补交付核验</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Pure Agent Drive：当前事实与新增建议</text><text x="32" y="136" font-size="28" text-anchor="start" font-weight="700" fill="#182638">当前：外层检查运行与报告协议</text><rect x="32" y="158" width="272" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="158" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="187" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="223" font-size="28" text-anchor="start" font-weight="700" fill="#182638">CLI 自主会话</text><text x="52" y="254" font-size="24" text-anchor="start" font-weight="400" fill="#182638">内部组织调查与修复</text><rect x="344" y="158" width="264" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="344" y="158" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="364" y="187" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="364" y="223" font-size="28" text-anchor="start" font-weight="700" fill="#182638">记录终态</text><text x="364" y="254" font-size="24" text-anchor="start" font-weight="400" fill="#182638">协议与进程结果检查</text><path d="M304,214 L344,214" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="298" width="576" height="58" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="333" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">协议有效，不等于独立业务测试通过。</text><text x="32" y="411" font-size="28" text-anchor="start" font-weight="700" fill="#182638">建议新增：只读交付核验点</text><rect x="32" y="435" width="272" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="32" y="435" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="52" y="464" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="52" y="500" font-size="28" text-anchor="start" font-weight="700" fill="#182638">会话交付</text><text x="52" y="531" font-size="24" text-anchor="start" font-weight="400" fill="#182638">候选 SHA、PR、证据</text><rect x="344" y="435" width="264" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="344" y="435" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="364" y="464" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="364" y="500" font-size="28" text-anchor="start" font-weight="700" fill="#182638">只读核验器</text><text x="364" y="531" font-size="24" text-anchor="start" font-weight="400" fill="#182638">查远端与同版本检查</text><path d="M304,491 L344,491" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M476,547 L476,600" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="607" width="576" height="86" rx="16" fill="#ffefec" stroke="none" stroke-width="2"/><text x="52" y="642" font-size="28" text-anchor="start" font-weight="700" fill="#a13325">缺失或旧证据：阻塞或返工</text><text x="52" y="673" font-size="24" text-anchor="start" font-weight="400" fill="#182638">不凭会话自述，直接宣布交付正确</text><rect x="32" y="710" width="576" height="58" rx="12" fill="#fff3d9" stroke="none" stroke-width="2"/><text x="50" y="745" font-size="24" text-anchor="start" font-weight="400" fill="#885800">下半图是建议，尚非该版本已有能力。</text><path d="M32,792 L608,792" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="811" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="811" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="811" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="811" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="829" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>