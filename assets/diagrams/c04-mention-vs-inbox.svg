<svg xmlns="http://www.w3.org/2000/svg" width="640" height="828" viewBox="0 0 640 828" role="img" aria-labelledby="title desc">
<title id="title">Agent 触发与人类通知分两路</title><desc id="desc">Multica：接收对象不同，平台语义也不同；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="828" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">Agent 触发与人类通知分两路</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Multica：接收对象不同，平台语义也不同</text><text x="32" y="136" font-size="28" text-anchor="start" font-weight="700" fill="#182638">Agent 路径：启动一次具体执行</text><rect x="32" y="160" width="276" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="160" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="189" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="225" font-size="28" text-anchor="start" font-weight="700" fill="#182638">结构化 mention</text><text x="52" y="256" font-size="24" text-anchor="start" font-weight="400" fill="#182638">目标由平台识别</text><rect x="348" y="160" width="260" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="348" y="160" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="368" y="189" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="368" y="225" font-size="28" text-anchor="start" font-weight="700" fill="#182638">按规则创建 Run</text><text x="368" y="256" font-size="24" text-anchor="start" font-weight="400" fill="#182638">随后由运行时执行</text><path d="M308,216 L348,216" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="300" width="576" height="58" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="335" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">普通文字 @名字，不自动等同结构化触发。</text><text x="32" y="415" font-size="28" text-anchor="start" font-weight="700" fill="#182638">人类路径：展示通知，再由人查看</text><rect x="32" y="439" width="276" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="439" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="468" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="504" font-size="28" text-anchor="start" font-weight="700" fill="#182638">人类 inbox</text><text x="52" y="535" font-size="24" text-anchor="start" font-weight="400" fill="#182638">通知进入可见界面</text><rect x="348" y="439" width="260" height="112" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="348" y="439" width="7" height="112" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="368" y="468" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="368" y="504" font-size="28" text-anchor="start" font-weight="700" fill="#182638">人查看通知</text><text x="368" y="535" font-size="24" text-anchor="start" font-weight="400" fill="#182638">出现不等于已读</text><path d="M308,495 L348,495" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="586" width="576" height="92" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="621" font-size="24" text-anchor="start" font-weight="400" fill="#126653">Agent 没有人类式 inbox。</text><text x="50" y="655" font-size="24" text-anchor="start" font-weight="400" fill="#126653">帮助型 mention 不必改变任务负责人。</text><text x="32" y="732" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">图中省略校验；并非每次提及都创建新 Run。</text><path d="M32,760 L608,760" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="779" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="797" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="779" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="797" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="779" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="797" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="779" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="797" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>