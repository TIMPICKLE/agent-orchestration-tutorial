<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1008" viewBox="0 0 640 1008" role="img" aria-labelledby="title desc">
<title id="title">主动行动，也要逐步过门</title><desc id="desc">Meta Muse：据公开职责构造的教学模型；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1008" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">主动行动，也要逐步过门</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Meta Muse：据公开职责构造的教学模型</text><rect x="128" y="122" width="384" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="122" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="151" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="187" font-size="28" text-anchor="start" font-weight="700" fill="#182638">事件或时间触发</text><text x="148" y="218" font-size="24" text-anchor="start" font-weight="400" fill="#182638">找到相关任务与状态</text><path d="M320,234 L320,260" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="128" y="270" width="384" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="128" y="270" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="148" y="299" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="148" y="335" font-size="28" text-anchor="start" font-weight="700" fill="#182638">模型提出动作</text><text x="148" y="366" font-size="24" text-anchor="start" font-weight="400" fill="#182638">结合目标与当前证据</text><path d="M320,382 L320,408" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="128" y="418" width="384" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="418" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="447" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="483" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行端权限检查</text><text x="148" y="514" font-size="24" text-anchor="start" font-weight="400" fill="#182638">允许后执行并保存结果</text><path d="M320,530 L320,556" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="128" y="566" width="384" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="128" y="566" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="148" y="595" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="148" y="631" font-size="28" text-anchor="start" font-weight="700" fill="#182638">通知价值判断</text><text x="148" y="662" font-size="24" text-anchor="start" font-weight="400" fill="#182638">重要变化？需要用户决定？</text><path d="M240,678 L240,724 L164,724 L164,754" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M400,678 L400,724 L476,724 L476,754" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="41" y="706" font-size="24" text-anchor="start" font-weight="400" fill="#182638">值得打断</text><text x="469" y="706" font-size="24" text-anchor="start" font-weight="400" fill="#182638">普通日志</text><rect x="32" y="754" width="264" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="754" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="783" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="819" font-size="28" text-anchor="start" font-weight="700" fill="#182638">通知用户</text><text x="52" y="850" font-size="24" text-anchor="start" font-weight="400" fill="#182638">核对渠道与内容范围</text><rect x="344" y="754" width="264" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="344" y="754" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="364" y="783" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="364" y="819" font-size="28" text-anchor="start" font-weight="700" fill="#182638">保留活动记录</text><text x="364" y="850" font-size="24" text-anchor="start" font-weight="400" fill="#182638">无需逐条打断人</text><text x="32" y="919" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">职责示意，非内部调用图，也未经亲测。</text><path d="M32,940 L608,940" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="959" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="977" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="959" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="977" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="959" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="977" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="959" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="977" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>