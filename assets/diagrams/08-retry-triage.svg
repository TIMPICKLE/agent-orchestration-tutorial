<svg xmlns="http://www.w3.org/2000/svg" width="640" height="792" viewBox="0 0 640 792" role="img" aria-labelledby="title desc">
<title id="title">同样失败，下一步可能不同</title><desc id="desc">先分类，再决定修复、重试、查询或停止；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="792" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">同样失败，下一步可能不同</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">先分类，再决定修复、重试、查询或停止</text><circle cx="58" cy="173" r="22" fill="#eaf2ff" stroke="#2856a3" stroke-width="2"/><text x="58" y="182" font-size="26" text-anchor="middle" font-weight="700" fill="#2856a3">1</text><rect x="101" y="124" width="507" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="101" y="124" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="121" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="121" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">测试断言失败</text><text x="121" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">修改候选，再验证新版本</text><circle cx="58" cy="310" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="319" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="101" y="261" width="507" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="101" y="261" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="121" y="290" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="121" y="326" font-size="28" text-anchor="start" font-weight="700" fill="#182638">执行环境缺少依赖</text><text x="121" y="357" font-size="24" text-anchor="start" font-weight="400" fill="#182638">处理环境，或报告阻塞</text><circle cx="58" cy="447" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="456" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">3</text><rect x="101" y="398" width="507" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="101" y="398" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="121" y="427" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="121" y="463" font-size="28" text-anchor="start" font-weight="700" fill="#182638">网络或进程暂时故障</text><text x="121" y="494" font-size="24" text-anchor="start" font-weight="400" fill="#182638">确认可安全后，有限重试</text><circle cx="58" cy="584" r="22" fill="#f1ebfa" stroke="#684699" stroke-width="2"/><text x="58" y="593" font-size="26" text-anchor="middle" font-weight="700" fill="#684699">4</text><rect x="101" y="535" width="507" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="101" y="535" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="121" y="564" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="121" y="600" font-size="28" text-anchor="start" font-weight="700" fill="#182638">创建PR后网络断开</text><text x="121" y="631" font-size="24" text-anchor="start" font-weight="400" fill="#182638">可能已经成功：先查询远端</text><path d="M32,724 L608,724" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="743" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="761" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="743" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="761" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="743" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="761" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="743" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="761" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>