<svg xmlns="http://www.w3.org/2000/svg" width="640" height="786" viewBox="0 0 640 786" role="img" aria-labelledby="title desc">
<title id="title">先学会一个闭环，再增加能力</title><desc id="desc">阅读层次，不是必须依次升级的架构；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
