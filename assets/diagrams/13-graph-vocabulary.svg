<svg xmlns="http://www.w3.org/2000/svg" width="640" height="880" viewBox="0 0 640 880" role="img" aria-labelledby="title desc">
<title id="title">节点、状态、边分别回答什么</title><desc id="desc">节点做工作；边依据更新后的状态选路；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="880" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">节点、状态、边分别回答什么</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">节点做工作；边依据更新后的状态选路</text><rect x="52" y="126" width="536" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="52" y="126" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="72" y="155" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="72" y="191" font-size="28" text-anchor="start" font-weight="700" fill="#182638">状态：当前知道什么</text><text x="72" y="222" font-size="24" text-anchor="start" font-weight="400" fill="#182638">candidate / passed / attempt</text><path d="M320,238 L320,286" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="270.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">节点读取状态</text><rect x="52" y="298" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="298" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="327" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="363" font-size="28" text-anchor="start" font-weight="700" fill="#182638">节点 verify：执行验证</text><text x="72" y="394" font-size="24" text-anchor="start" font-weight="400" fill="#182638">普通函数即可，不必是Agent</text><path d="M320,410 L320,458" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="442.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">返回更新：passed</text><rect x="52" y="470" width="536" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="52" y="470" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="72" y="499" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="72" y="535" font-size="28" text-anchor="start" font-weight="700" fill="#182638">边：下一步去哪里</text><text x="72" y="566" font-size="24" text-anchor="start" font-weight="400" fill="#182638">读取更新后的状态进行路由</text><path d="M320,583 L320,625 L122,625 L122,665" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,625 L320,665" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320,625 L518,625 L518,665" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="32" y="680" width="176" height="91" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="120" y="718" font-size="26" text-anchor="middle" font-weight="700" fill="#182638">report</text><text x="120" y="752" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">报告结果</text><rect x="232" y="680" width="176" height="91" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="320" y="718" font-size="26" text-anchor="middle" font-weight="700" fill="#182638">propose</text><text x="320" y="752" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">再提候选</text><rect x="432" y="680" width="176" height="91" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="520" y="718" font-size="26" text-anchor="middle" font-weight="700" fill="#182638">blocked</text><text x="520" y="752" font-size="24" text-anchor="middle" font-weight="400" fill="#182638">报告阻塞</text><path d="M32,812 L608,812" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="831" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="831" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="831" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="831" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="849" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>