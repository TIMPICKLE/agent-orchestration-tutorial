<svg xmlns="http://www.w3.org/2000/svg" width="640" height="885" viewBox="0 0 640 885" role="img" aria-labelledby="title desc">
<title id="title">外层重试，不重置任务总预算</title><desc id="desc">两种循环：任务尝试与内部工具行动；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="885" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">外层重试，不重置任务总预算</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">两种循环：任务尝试与内部工具行动</text><rect x="32" y="125" width="576" height="615" rx="16" fill="#e8f6f2" stroke="#126653" stroke-width="2" stroke-dasharray="7 5"/><text x="52" y="167" font-size="28" text-anchor="start" font-weight="700" fill="#126653">任务总预算：跨尝试累计</text><rect x="61" y="198" width="518" height="314" rx="16" fill="#ffffff" stroke="#ced8e5" stroke-width="2"/><text x="82" y="241" font-size="28" text-anchor="start" font-weight="700" fill="#182638">外层尝试1</text><text x="82" y="284" font-size="26" text-anchor="start" font-weight="400" fill="#182638">准备 → 执行 → 收尾</text><rect x="82" y="316" width="476" height="112" rx="16" fill="#eaf2ff" stroke="none" stroke-width="2"/><rect x="82" y="316" width="7" height="112" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="102" y="345" font-size="22" text-anchor="start" font-weight="700" fill="#2856a3">模型判断</text><text x="102" y="381" font-size="28" text-anchor="start" font-weight="700" fill="#182638">内层行动循环</text><text x="102" y="412" font-size="24" text-anchor="start" font-weight="400" fill="#182638">读 → 改 → 测 → 利用反馈</text><text x="82" y="475" font-size="24" text-anchor="start" font-weight="400" fill="#182638">每个实际动作计入任务消耗</text><path d="M320,513 L320,550" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="539.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">若仍可重试</text><rect x="61" y="563" width="518" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="61" y="563" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="81" y="592" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="81" y="628" font-size="28" text-anchor="start" font-weight="700" fill="#182638">外层尝试2</text><text x="81" y="659" font-size="24" text-anchor="start" font-weight="400" fill="#182638">只使用任务的剩余预算</text><text x="52" y="714" font-size="28" text-anchor="start" font-weight="700" fill="#126653">新尝试 ≠ 免费重开</text><path d="M32,817 L608,817" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="836" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="854" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="836" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="854" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="836" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="854" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="836" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="854" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>