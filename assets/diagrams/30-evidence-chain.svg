<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1040" viewBox="0 0 640 1040" role="img" aria-labelledby="title desc">
<title id="title">把每一段交付与版本连起来</title><desc id="desc">虚构流程：每条边都需要可核验的关联；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1040" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">把每一段交付与版本连起来</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">虚构流程：每条边都需要可核验的关联</text><rect x="88" y="120" width="464" height="112" rx="16" fill="#f3f5f7" stroke="none" stroke-width="2"/><rect x="88" y="120" width="7" height="112" rx="3" fill="#4a5768" stroke="none" stroke-width="2"/><text x="108" y="149" font-size="22" text-anchor="start" font-weight="700" fill="#4a5768">任务信息</text><text x="108" y="185" font-size="28" text-anchor="start" font-weight="700" fill="#182638">工单 1042</text><text x="108" y="216" font-size="24" text-anchor="start" font-weight="400" fill="#182638">范围、验收条件、基线版本</text><path d="M320,232 L320,258" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="88" y="264" width="464" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="88" y="264" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="108" y="293" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="108" y="329" font-size="28" text-anchor="start" font-weight="700" fill="#182638">候选 B 与测试 B</text><text x="108" y="360" font-size="24" text-anchor="start" font-weight="400" fill="#182638">测试记录对应当前候选</text><path d="M320,376 L320,402" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="88" y="408" width="464" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="88" y="408" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="108" y="437" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="108" y="473" font-size="28" text-anchor="start" font-weight="700" fill="#182638">PR 与构建</text><text x="108" y="504" font-size="24" text-anchor="start" font-weight="400" fill="#182638">PR head B ↔ build ID</text><path d="M320,520 L320,546" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="88" y="552" width="464" height="112" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="88" y="552" width="7" height="112" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="108" y="581" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="108" y="617" font-size="28" text-anchor="start" font-weight="700" fill="#182638">测试包与人工结论</text><text x="108" y="648" font-size="24" text-anchor="start" font-weight="400" fill="#182638">包摘要、来源、验收结果</text><path d="M320,664 L320,690" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="88" y="696" width="464" height="112" rx="16" fill="#fff3d9" stroke="none" stroke-width="2"/><rect x="88" y="696" width="7" height="112" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="108" y="725" font-size="22" text-anchor="start" font-weight="700" fill="#885800">人工决定</text><text x="108" y="761" font-size="28" text-anchor="start" font-weight="700" fill="#182638">具体动作的授权记录</text><text x="108" y="792" font-size="24" text-anchor="start" font-weight="400" fill="#182638">执行前再核对目标与当前版本</text><rect x="32" y="854" width="576" height="92" rx="12" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="50" y="889" font-size="24" text-anchor="start" font-weight="400" fill="#126653">质量通过与操作授权，要分别记录。</text><text x="50" y="923" font-size="24" text-anchor="start" font-weight="400" fill="#126653">任务只到本地补丁，就在相应处停止。</text><path d="M32,972 L608,972" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="991" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="1009" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="991" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="1009" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="991" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="1009" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="991" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="1009" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>