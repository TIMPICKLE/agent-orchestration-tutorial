<svg xmlns="http://www.w3.org/2000/svg" width="640" height="980" viewBox="0 0 640 980" role="img" aria-labelledby="title desc">
<title id="title">任务在库里，通道提示有活</title><desc id="desc">Multica：实时提示与轮询都指向任务库；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="980" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">任务在库里，通道提示有活</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">Multica：实时提示与轮询都指向任务库</text><rect x="128" y="120" width="384" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="128" y="120" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="148" y="149" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="148" y="185" font-size="28" text-anchor="start" font-weight="700" fill="#182638">数据库：事实来源</text><text x="148" y="216" font-size="24" text-anchor="start" font-weight="400" fill="#182638">持久保存任务与 Run</text><path d="M226,232 L226,276 L168,276 L168,308" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M472,308 L472,276 L414,276 L414,232" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="57" y="262" font-size="24" text-anchor="start" font-weight="400" fill="#182638">有新任务</text><text x="456" y="262" font-size="24" text-anchor="start" font-weight="400" fill="#182638">兜底查询</text><rect x="32" y="308" width="272" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="308" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="337" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="373" font-size="28" text-anchor="start" font-weight="700" fill="#182638">实时提示</text><text x="52" y="404" font-size="24" text-anchor="start" font-weight="400" fill="#182638">告诉 daemon 有活</text><rect x="336" y="308" width="272" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="336" y="308" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="356" y="337" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="356" y="373" font-size="28" text-anchor="start" font-weight="700" fill="#182638">轮询路径</text><text x="356" y="404" font-size="24" text-anchor="start" font-weight="400" fill="#182638">提示丢失仍可检查</text><path d="M168,420 L168,461 L320,461 L320,493" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M430,493 L430,461 L472,461 L472,420" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="112" y="493" width="416" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="112" y="493" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="132" y="522" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="132" y="558" font-size="28" text-anchor="start" font-weight="700" fill="#182638">daemon 领取并执行</text><text x="132" y="589" font-size="24" text-anchor="start" font-weight="400" fill="#182638">检查绑定、状态与并发条件</text><path d="M320,605 L320,635" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="112" y="645" width="416" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="112" y="645" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="132" y="674" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="132" y="710" font-size="28" text-anchor="start" font-weight="700" fill="#182638">有条件地写回结果</text><text x="132" y="741" font-size="24" text-anchor="start" font-weight="400" fill="#182638">仍属有效领取，才允许更新</text><rect x="32" y="788" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="823" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">旧领取者迟到，不能覆盖新的状态。</text><text x="50" y="857" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">数据库锁不保证外部动作恰好一次。</text><path d="M32,912 L608,912" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="931" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="949" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="931" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="949" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="931" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="949" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="931" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="949" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>