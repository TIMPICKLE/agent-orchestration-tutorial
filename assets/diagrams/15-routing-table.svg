<svg xmlns="http://www.w3.org/2000/svg" width="640" height="916" viewBox="0 0 640 916" role="img" aria-labelledby="title desc">
<title id="title">路由是有顺序的判断</title><desc id="desc">先看成功，再看剩余尝试次数；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="916" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">路由是有顺序的判断</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">先看成功，再看剩余尝试次数</text><rect x="32" y="124" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="124" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">先读取验证结果</text><text x="52" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">passed 与 attempt</text><circle cx="58" cy="321" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="330" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">1</text><rect x="103" y="278" width="505" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="103" y="278" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="123" y="307" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="123" y="343" font-size="28" text-anchor="start" font-weight="700" fill="#182638">passed = True</text><text x="123" y="374" font-size="24" text-anchor="start" font-weight="400" fill="#182638">→ report：报告结果</text><path d="M320,390 L320,427" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="416.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">否则</text><circle cx="58" cy="484" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="493" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">2</text><rect x="103" y="441" width="505" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="103" y="441" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="123" y="470" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="123" y="506" font-size="28" text-anchor="start" font-weight="700" fill="#182638">否则，attempt &lt; 3</text><text x="123" y="537" font-size="24" text-anchor="start" font-weight="400" fill="#182638">→ propose：再提候选</text><path d="M320,553 L320,590" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="579.5" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">否则</text><circle cx="58" cy="647" r="22" fill="#e8f6f2" stroke="#126653" stroke-width="2"/><text x="58" y="656" font-size="26" text-anchor="middle" font-weight="700" fill="#126653">3</text><rect x="103" y="604" width="505" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="103" y="604" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="123" y="633" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="123" y="669" font-size="28" text-anchor="start" font-weight="700" fill="#182638">否则，预算已耗尽</text><text x="123" y="700" font-size="24" text-anchor="start" font-weight="400" fill="#182638">→ blocked：报告阻塞</text><rect x="32" y="759" width="576" height="92" rx="12" fill="#ffefec" stroke="none" stroke-width="2"/><text x="50" y="794" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">模型给出路由时，先验证允许值。</text><text x="50" y="828" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">未知值必须拒绝，不自动新增能力。</text><path d="M32,848 L608,848" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="867" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="885" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="867" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="885" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="867" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="885" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="867" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="885" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>