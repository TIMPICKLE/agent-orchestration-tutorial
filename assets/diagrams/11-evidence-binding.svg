<svg xmlns="http://www.w3.org/2000/svg" width="640" height="884" viewBox="0 0 640 884" role="img" aria-labelledby="title desc">
<title id="title">通过的是A，为什么不能交付B</title><desc id="desc">测试证据只支持它实际验证过的版本；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="884" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">通过的是A，为什么不能交付B</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">测试证据只支持它实际验证过的版本</text><rect x="32" y="125" width="270" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="125" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="154" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="190" font-size="28" text-anchor="start" font-weight="700" fill="#182638">候选A</text><text x="52" y="221" font-size="24" text-anchor="start" font-weight="400" fill="#182638">当前内容摘要A</text><rect x="338" y="125" width="270" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="338" y="125" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="358" y="154" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="358" y="190" font-size="28" text-anchor="start" font-weight="700" fill="#182638">测试记录A</text><text x="358" y="221" font-size="24" text-anchor="start" font-weight="400" fill="#182638">通过，绑定摘要A</text><path d="M303,180 L329,180" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M165,237 L165,285" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="183" y="269.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">继续编辑</text><rect x="32" y="298" width="270" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="298" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="327" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="363" font-size="28" text-anchor="start" font-weight="700" fill="#182638">候选B</text><text x="52" y="394" font-size="24" text-anchor="start" font-weight="400" fill="#182638">内容已经变化</text><rect x="338" y="298" width="270" height="112" rx="16" fill="#ffefec" stroke="none" stroke-width="2"/><rect x="338" y="298" width="7" height="112" rx="3" fill="#a13325" stroke="none" stroke-width="2"/><text x="358" y="327" font-size="22" text-anchor="start" font-weight="700" fill="#a13325">风险</text><text x="358" y="363" font-size="28" text-anchor="start" font-weight="700" fill="#182638">仍是旧记录A</text><text x="358" y="394" font-size="24" text-anchor="start" font-weight="400" fill="#182638">不能证明B通过</text><path d="M303,354 L330,354" fill="none" stroke="#a13325" stroke-width="2.5" stroke-dasharray="7 5"/><text x="320" y="453" font-size="30" text-anchor="middle" font-weight="700" fill="#a13325">候选B ≠ 证据绑定的A</text><rect x="64" y="490" width="512" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="64" y="490" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="84" y="519" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="84" y="555" font-size="28" text-anchor="start" font-weight="700" fill="#182638">重新验证B</text><text x="84" y="586" font-size="24" text-anchor="start" font-weight="400" fill="#182638">核对来源、命令、结果与版本</text><path d="M320,602 L320,646" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="632.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">取得B的有效证据</text><rect x="32" y="659" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="694" font-size="28" text-anchor="start" font-weight="700" fill="#126653">再依据任务契约判断交付</text><text x="32" y="792" font-size="24" text-anchor="start" font-weight="400" fill="#182638">摘要绑定内容，不自动保证证据可信。</text><path d="M32,816 L608,816" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="835" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="853" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="835" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="853" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="835" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="853" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="835" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="853" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>