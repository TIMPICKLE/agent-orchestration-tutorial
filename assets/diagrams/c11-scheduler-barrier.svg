<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1166" viewBox="0 0 640 1166" role="img" aria-labelledby="title desc">
<title id="title">并发安全批次，中间有独占屏障</title><desc id="desc">2.1.88 历史快照 · 非流式路径静态阅读；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="1166" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">并发安全批次，中间有独占屏障</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">2.1.88 历史快照 · 非流式路径静态阅读</text><rect x="32" y="124" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="124" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">runTools → partitionToolCalls</text><text x="52" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">按连续调用分组，不是全局DAG规划</text><path d="M320,236 L320,270" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="338" y="261.0" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">schema之后按输入分类</text><rect x="32" y="281" width="576" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="281" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="310" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="346" font-size="28" text-anchor="start" font-weight="700" fill="#182638">isConcurrencySafe(input)</text><text x="52" y="377" font-size="24" text-anchor="start" font-weight="400" fill="#182638">分类异常 → 保守判为不安全</text><text x="32" y="445" font-size="24" text-anchor="start" font-weight="400" fill="#182638">时间向下：A、B、C、D、E是调用标识</text><rect x="32" y="476" width="276" height="106" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="476" width="7" height="106" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="505" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="541" font-size="28" text-anchor="start" font-weight="700" fill="#182638">安全调用A</text><text x="52" y="572" font-size="24" text-anchor="start" font-weight="400" fill="#182638">与B并发</text><rect x="332" y="476" width="276" height="106" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="332" y="476" width="7" height="106" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="352" y="505" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="352" y="541" font-size="28" text-anchor="start" font-weight="700" fill="#182638">安全调用B</text><text x="352" y="572" font-size="24" text-anchor="start" font-weight="400" fill="#182638">与A并发</text><path d="M170,582 L170,620 L320,620 L320,650" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M470,582 L470,620 L320,620" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round"/><text x="32" y="645" font-size="24" text-anchor="start" font-weight="400" fill="#182638">等待本批结束</text><rect x="150" y="664" width="340" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="150" y="664" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="170" y="693" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="170" y="729" font-size="28" text-anchor="start" font-weight="700" fill="#182638">不安全调用C</text><text x="170" y="760" font-size="24" text-anchor="start" font-weight="400" fill="#182638">独占执行，形成屏障</text><path d="M320,776 L320,814 L170,814 L170,847" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M320,814 L470,814 L470,847" fill="none" stroke="#68778a" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="32" y="800" font-size="24" text-anchor="start" font-weight="400" fill="#182638">等待C结束</text><rect x="32" y="860" width="276" height="106" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="32" y="860" width="7" height="106" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="52" y="889" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="52" y="925" font-size="28" text-anchor="start" font-weight="700" fill="#182638">安全调用D</text><text x="52" y="956" font-size="24" text-anchor="start" font-weight="400" fill="#182638">与E并发</text><rect x="332" y="860" width="276" height="106" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="332" y="860" width="7" height="106" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="352" y="889" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="352" y="925" font-size="28" text-anchor="start" font-weight="700" fill="#182638">安全调用E</text><text x="352" y="956" font-size="24" text-anchor="start" font-weight="400" fill="#182638">与D并发</text><rect x="32" y="997" width="576" height="92" rx="12" fill="#f3f5f7" stroke="none" stroke-width="2"/><text x="50" y="1032" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">安全性取决于输入，不能只看工具名。</text><text x="50" y="1066" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">流式执行器是另一实现，勿混用限额。</text><path d="M32,1098 L608,1098" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="1117" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="1135" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="1117" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="1135" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="1117" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="1135" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="1117" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="1135" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>