<svg xmlns="http://www.w3.org/2000/svg" width="640" height="920" viewBox="0 0 640 920" role="img" aria-labelledby="title desc">
<title id="title">消息发出，确认却丢失</title><desc id="desc">发送成功与本地知道成功，是两回事；蓝色表示模型判断，绿色表示程序控制，黄色表示人工决定，紫色表示外部状态。各角色均有文字标签。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#68778a"/></marker></defs>
<rect width="640" height="920" fill="#ffffff"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><text x="32" y="48" font-size="32" text-anchor="start" font-weight="700" fill="#182638">消息发出，确认却丢失</text><text x="32" y="86" font-size="24" text-anchor="start" font-weight="400" fill="#4a5768">发送成功与本地知道成功，是两回事</text><rect x="32" y="124" width="268" height="112" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><rect x="32" y="124" width="7" height="112" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="52" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#126653">程序控制</text><text x="52" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">持久待发箱</text><text x="52" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">稳定消息 ID：M7</text><rect x="344" y="124" width="264" height="112" rx="16" fill="#f1ebfa" stroke="none" stroke-width="2"/><rect x="344" y="124" width="7" height="112" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="364" y="153" font-size="22" text-anchor="start" font-weight="700" fill="#684699">外部状态</text><text x="364" y="189" font-size="28" text-anchor="start" font-weight="700" fill="#182638">接收服务</text><text x="364" y="220" font-size="24" text-anchor="start" font-weight="400" fill="#182638">按协议接收消息</text><path d="M166,236 L166,650" fill="none" stroke="#126653" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M476,236 L476,650" fill="none" stroke="#684699" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M166,286 L476,286" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="207" y="269" font-size="24" text-anchor="start" font-weight="400" fill="#182638">发送 M7</text><text x="488" y="317" font-size="24" text-anchor="start" font-weight="400" fill="#684699">已接收</text><path d="M476,350 L286,350" fill="none" stroke="#68778a" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="292" y="387" font-size="24" text-anchor="start" font-weight="400" fill="#a13325">确认回复丢失</text><text x="170" y="403" font-size="36" text-anchor="start" font-weight="700" fill="#a13325">×</text><rect x="32" y="433" width="268" height="112" rx="16" fill="#ffefec" stroke="none" stroke-width="2"/><rect x="32" y="433" width="7" height="112" rx="3" fill="#a13325" stroke="none" stroke-width="2"/><text x="52" y="462" font-size="22" text-anchor="start" font-weight="700" fill="#a13325">风险</text><text x="52" y="498" font-size="28" text-anchor="start" font-weight="700" fill="#182638">本地：结果未知</text><text x="52" y="529" font-size="24" text-anchor="start" font-weight="400" fill="#182638">先查询，不盲目重发</text><path d="M300,492 L476,492" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="314" y="471" font-size="24" text-anchor="start" font-weight="400" fill="#182638">查询 M7</text><path d="M476,602 L166,602" fill="none" stroke="#68778a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="207" y="584" font-size="24" text-anchor="start" font-weight="400" fill="#182638">核实接收结果</text><rect x="32" y="660" width="576" height="86" rx="16" fill="#e8f6f2" stroke="none" stroke-width="2"/><text x="52" y="695" font-size="28" text-anchor="start" font-weight="700" fill="#126653">程序保存核实后的状态</text><text x="52" y="726" font-size="24" text-anchor="start" font-weight="400" fill="#182638">服务接收 ≠ 送达 ≠ 已读</text><rect x="32" y="764" width="576" height="58" rx="12" fill="#f1ebfa" stroke="none" stroke-width="2"/><text x="50" y="799" font-size="24" text-anchor="start" font-weight="400" fill="#684699">查询或幂等重试，须有接收平台支持。</text><path d="M32,852 L608,852" fill="none" stroke="#dfe5eb" stroke-width="2.5"/><rect x="32" y="871" width="8" height="22" rx="3" fill="#2856a3" stroke="none" stroke-width="2"/><text x="48" y="889" font-size="22" text-anchor="start" font-weight="400" fill="#2856a3">模型判断</text><rect x="178" y="871" width="8" height="22" rx="3" fill="#126653" stroke="none" stroke-width="2"/><text x="194" y="889" font-size="22" text-anchor="start" font-weight="400" fill="#126653">程序控制</text><rect x="324" y="871" width="8" height="22" rx="3" fill="#885800" stroke="none" stroke-width="2"/><text x="340" y="889" font-size="22" text-anchor="start" font-weight="400" fill="#885800">人工决定</text><rect x="470" y="871" width="8" height="22" rx="3" fill="#684699" stroke="none" stroke-width="2"/><text x="486" y="889" font-size="22" text-anchor="start" font-weight="400" fill="#684699">外部状态</text></g></svg>